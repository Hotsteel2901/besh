name: build & test

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'web/**'
      - '**/*.md'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths-ignore:
      - 'web/**'
      - '**/*.md'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (warnings are treated as failures)
        run: |
          make clean
          make CFLAGS='-Wall -Wextra -O2 -g -Werror'

      - name: Differential suite (bash vs besh)
        run: tests/run.sh

      - name: Interactive suite (pty: line editor, history, completion)
        run: python3 tests/interactive.py

      # The differential suite proves besh agrees with bash; it cannot see a
      # buffer overrun that happens to produce the right bytes.  Three real
      # memory bugs (two brace-expansion overruns, and a here-doc queue that
      # grew past its fixed array) were only visible under a sanitizer, so it
      # runs here too.  This is the last build step, so the sanitized binary
      # is simply discarded afterwards.
      - name: Build with sanitizers
        run: make asan

      - name: Differential suite under ASan + UBSan
        run: |
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 tests/run.sh
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 python3 tests/interactive.py
